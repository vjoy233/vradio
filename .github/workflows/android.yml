# 安卓端 CI（M0 拍板：path filter android/** —— Web 提交不烧安卓 CI，review Q5/A12）
# 本机镜像环境「能编」不作数，CI 是唯一干净环境验证。
name: android

on:
  push:
    branches: [main]
    paths: ['android/**', 'contracts/**', 'radio.txt', 'logos.txt', 'radio-meta.json', '.github/workflows/android.yml', '.github/workflows/android-instrumented-draft.yml']
  pull_request:
    paths: ['android/**', 'contracts/**', 'radio.txt', 'logos.txt', 'radio-meta.json', '.github/workflows/android.yml', '.github/workflows/android-instrumented-draft.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0：assets 打包基线 data-stamp.txt 取 radio/logos 的 git log 最后提交较新者，
      # 浅检出在 HEAD 未动过数据文件时取不到历史会退回构建时刻（AIbot P3）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # android runner 镜像自带 SDK 与已接受的 licenses；缺件由 AGP 自动补装
      # 单测纯 JVM 秒级：debug 变体即覆盖全部用例（G P3：test 连跑 debug+release 两套时间翻倍）
      - name: 单元测试（parser/classifyCn 金样/store/cfg/backup/health/myradio）
        run: android/gradlew --project-dir android testDebugUnitTest
      # 设备测试代码持续编译门（AIbot P2：testDebugUnitTest/assemble* 都不编 androidTest，
      # 骨架编译回归此前只能等夜间草案才暴露）；无需模拟器，不改变「设备执行下一批接入」的决定
      - name: 编译 androidTest（设备测试代码 + runner 接线持续门禁）
        run: android/gradlew --project-dir android compileDebugAndroidTestKotlin
      - name: 构建 debug APK
        run: android/gradlew --project-dir android assembleDebug
      - name: debug APK 体积哨兵（事故哨兵而非功能预算）
        run: |
          SIZE=$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)
          MB=$((SIZE / 1048576))
          echo "debug APK: ${MB}MB (${SIZE} bytes)"
          # debug 不含 R8 收缩（实测 ~15MB 属正常），哨兵按 20MB 防资源误打包
          if [ "$SIZE" -gt 20971520 ]; then echo "::error::debug APK 超过 20MB 哨兵线"; exit 1; fi
      - name: 构建 release APK（R8）+ M5 体积哨兵 5MB
        run: |
          android/gradlew --project-dir android assembleRelease
          SIZE=$(stat -c%s android/app/build/outputs/apk/release/app-release.apk)
          MB=$((SIZE / 1048576))
          echo "release APK: ${MB}MB (${SIZE} bytes)"
          # M5 哨兵：R8 忘开/资源误打包会爆线（合规基线实测 2.7MB；keystore 缺席时 debug 签名，包可装）
          if [ "$SIZE" -gt 5242880 ]; then echo "::error::release APK 超过 5MB 哨兵线"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: vradio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # batch1 N14：合并即可拿可装 release 包（keystore 缺席时 debug 签名，可直装）
      - uses: actions/upload-artifact@v4
        with:
          name: vradio-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
