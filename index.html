<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VRadio · 网络电台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231a2027'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%234fc08d'/%3E%3Cpath d='M8 12a10 10 0 0 1 0 8M24 12a10 10 0 0 1 0 8' stroke='%234fc08d' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a323c; --tx:#e8ecf1; --dim:#8b97a5; --acc:#4fc08d; --warn:#e07a5f; color-scheme:dark; }
  :root[data-theme="light"] { --bg:#f4f6f8; --panel:#ffffff; --line:#d9dee4; --tx:#1f2733; --dim:#5d6a77; --acc:#1f7a54; --warn:#b5431a; color-scheme:light; } /* 浅色主题（E5）：data-theme 由 app.js 按手动选择/系统偏好写入；acc/warn 按浅色底单独分档（UI 审计 P1-2：深色档在白面板仅 2.27/2.95:1 不达 WCAG AA，实测 #1f7a54=5.29 #b5431a=5.55） */
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; } /* 作者样式（.btn 的 inline-flex、#mStations 的 flex 等）会压过 UA 的 [hidden] 隐藏——全局根治，不再逐元素补丁（AIbot PR#9 review P1-a/P1-b） */
  body { background:var(--bg); color:var(--tx); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; display:flex; flex-direction:column; height:100vh; height:100dvh; } /* dvh：iOS 动态工具栏下不被裁切（P3-9） */
  :focus-visible { outline:2px solid var(--acc); outline-offset:1px; } /* 键盘焦点可见（不删 outline；outline 自动跟随元素圆角） */
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; position:relative; }
  header h1 { font-size:16px; font-weight:600; white-space:nowrap; }
  header h1 .live { color:var(--acc); }
  #q { flex:1; min-width:140px; background:var(--panel); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:7px 12px; outline:none; font:inherit; }
  #q:focus { border-color:var(--acc); }
  .btn { background:var(--panel); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap; font:inherit; transition:border-color .15s, background-color .15s; display:inline-flex; align-items:center; gap:5px; }
  .ic { width:1em; height:1em; flex:0 0 auto; } /* sprite 引用：1em 随按钮字号缩放，stroke 走 currentColor 继承主题色（UI 审计 P3-1） */
  #pp .ic, #prevFav .ic, #nextFav .ic { width:17px; height:17px; } /* 中部三键（P3）：prev/next 与 pp 同尺寸 */
  /* 播放器底栏三组（P3/§4.3/§6.5）：紧凑态 display:contents 对布局透明——子级仍为 footer flex 的直接布局项，
     旧紧凑布局除新增 #prevFav/#nextFav（#pp 两侧，G19 双端语义）外零变化 */
  .player-identity, .player-main, .player-helpers { display:contents; }
  .btn:hover { border-color:var(--acc); }
  .btn.on { color:var(--acc); border-color:var(--acc); }
  .btn:active, .chip:active, .row:active, .card:active { transform:translateY(1px); } /* 按压物理反馈（UI 审计 A 批：此前无 :active 态） */
  .fav:active { transform:scale(.9); }
  #cats { display:flex; gap:8px; padding:8px 14px; overflow-x:auto; border-bottom:1px solid var(--line); flex:0 0 auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  /* 分类条两端渐隐（UI 审计 P3-5）：按滚动位置由 app.updateCatsFade 切换 mask，提示横向可滚 */
  #cats.fade-l.fade-r { mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent); -webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent); }
  #cats.fade-l:not(.fade-r) { mask-image:linear-gradient(90deg,transparent,#000 18px); -webkit-mask-image:linear-gradient(90deg,transparent,#000 18px); }
  #cats.fade-r:not(.fade-l) { mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent); -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent); }
  .chip { padding:5px 12px; min-height:30px; border-radius:999px; border:1px solid var(--line); color:var(--dim); cursor:pointer; white-space:nowrap; font:inherit; font-size:13px; background:transparent; transition:color .15s, border-color .15s; }
  .chip:hover { color:var(--tx); }
  .chip.on { color:var(--acc); border-color:var(--acc); }
  .chip .n { font-style:normal; font-size:10px; color:var(--dim); margin-left:5px; } /* 数量角标（UI 审计 P3-5）：预判列表规模 */
  .chip.on .n { color:inherit; opacity:.7; }
  #list { flex:1; overflow-y:auto; padding:6px 14px 90px; scroll-padding-bottom:90px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; } /* scroll-padding 防止焦点行被固定 footer 遮挡；细滚动条（UI 审计 A 批） */
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; transition:background-color .15s; }
  .row, .card { touch-action: manipulation; } /* 双击收藏（audit-r2 拍板）：关移动端双击缩放，双击/长按手势语义稳定 */
  .row:hover, .row.playing { background:var(--panel); }
  .row.playing .name { color:var(--acc); }
  .row.playing .name::before { content:'▶ '; color:var(--acc); }
  .row.connecting .name::before { content:'● '; animation:pulse 1s infinite; } /* 连接中脉冲提示等待 */
  @keyframes pulse { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) { .row.connecting .name::before, .card.connecting .cname::before, #eq.on i, .card.playing::after { animation:none; } #prog { display:none; } #list.swap .row, #list.swap .card, .row.flash, .card.flash { animation:none; } * { transition:none !important; } }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 6px; white-space:nowrap; }
  .srcs { font-size:12px; color:var(--dim); white-space:nowrap; }
  .fav { color:var(--dim); font-size:16px; padding:4px 6px; margin:-4px 0; border:none; border-radius:8px; background:none; cursor:pointer; line-height:1; transition:color .15s; } /* 扩大点击区域 ≥24px；圆角 6→8 归档（UI 审计 P3-3 圆角七档收敛） */
  .fav:hover { color:#f5c542; }
  .fav.on { color:#f5c542; }
  :root[data-theme="light"] .fav:hover, :root[data-theme="light"] .fav.on { color:#8a6508; } /* 浅色下 #f5c542 对白面板仅 1.62:1 金星隐形（P1-2），定 #8a6508=5.32:1 */
  .row.dead .name { text-decoration:line-through; opacity:.45; }
  .row .name, .card .cname { font-weight:500; } /* 字重层级（UI 审计 P3-2）：台名 500，播中 600，层级不再全靠字号+颜色 */
  .row.playing .name, .card.playing .cname { font-weight:600; }
  .health { font-size:12px; white-space:nowrap; }
  .health.ok { color:var(--acc); } .health.bad { color:var(--warn); }
  .btn:disabled { opacity:.5; cursor:wait; }
  footer { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; gap:12px; align-items:center; flex-wrap:wrap; } /* safe-area：全面屏底部不被遮挡（P3-9） */
  footer #now { flex:1; min-width:120px; overflow:hidden; display:flex; flex-direction:column; line-height:1.45; } /* 两行：台名 + 曲讯（B-6） */
  footer #nowline { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  footer #nowline.canfind { cursor:pointer; } /* 有正在播台时可点定位（N5/r2 ⑦） */
  .row.flash, .card.flash { animation:flashrow 1s ease-out; } /* 定位高亮一闪（N5） */
  @keyframes flashrow { 0%,70% { outline:2px solid var(--acc); outline-offset:-2px; } }
  #song { font-size:12px; color:var(--dim); cursor:pointer; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #song:hover { color:var(--acc); }
  #songhist { position:fixed; right:14px; bottom:72px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; max-width:min(380px, 82vw); max-height:38vh; overflow-y:auto; z-index:9; font-size:12px; } /* 歌曲历史浮层（B-7） */
  #songhist b { display:block; margin-bottom:4px; color:var(--dim); font-weight:500; }
  #songhist .shhead { display:flex; align-items:center; justify-content:space-between; gap:8px; } /* 头部：标题 + 导出全部（N2） */
  #songhist .shhead b { margin-bottom:0; }
  /* 快捷键帮助（N8/r2 ⑧）：? 呼出的 cheatsheet；kbd 键帽样式与面板浮层同语言 */
  #keys { position:fixed; right:14px; bottom:72px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; max-width:min(360px,82vw); z-index:9; font-size:12px; }
  #keys b { display:block; margin-bottom:6px; color:var(--dim); font-weight:500; }
  #keys .krow { display:flex; gap:8px; align-items:baseline; padding:2px 0; }
  #keys .krow span { flex:0 0 auto; min-width:72px; display:inline-flex; gap:3px; }
  #keys .knote { margin-top:6px; padding-top:6px; border-top:1px solid var(--line); color:var(--dim); }
  kbd { font:inherit; font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--bg); white-space:nowrap; }
  .shrow { padding:2px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  footer #status { font-size:12px; color:var(--dim); }
  /* 同步/体检不确定进度条（UI 审计 P3-8）：贴 footer 顶边 2px，transform 动画不走 layout；reduced-motion 隐藏（状态栏文案仍在） */
  #prog { position:absolute; top:-1px; left:0; right:0; height:2px; overflow:hidden; }
  #prog i { position:absolute; top:0; bottom:0; width:40%; background:var(--acc); transform:translateX(-100%); animation:prog 1.1s ease-in-out infinite; }
  @keyframes prog { to { transform:translateX(350%); } }
  /* 视图/分类切换淡入（E 批）：仅 swap 类挂期间生效，搜索逐键重渲不闪 */
  #list.swap .row, #list.swap .card { animation:fadein .14s ease-out; }
  @keyframes fadein { from { opacity:0; } }
  #vol { width:110px; accent-color:var(--acc); }
  #sleepBtn { min-width:76px; font-variant-numeric:tabular-nums; } /* 倒计时每秒变宽会引起 footer 抖动（UI 审计 P3-2）：min-width + 等宽数字 */
  .srcs, .cnt, .health, .badge { font-variant-numeric:tabular-nums; }
  #eq { display:inline-flex; align-items:flex-end; gap:2px; height:14px; } /* 均衡器动画（E6）：一眼可辨「活着且在播」 */
  #eq i { width:3px; height:4px; background:var(--dim); border-radius:1px; }
  #eq.on i { background:var(--acc); animation:eq .9s ease-in-out infinite; }
  #eq.on i:nth-child(2) { animation-delay:.25s; }
  #eq.on i:nth-child(3) { animation-delay:.5s; }
  @keyframes eq { 50% { height:14px; } }
  /* 视图切换段控（网格=精简卡片 / 列表=两行详情） */
  .seg { display:inline-flex; }
  .seg .btn { border-radius:0; margin-left:-1px; }
  .seg .btn:first-child { border-radius:8px 0 0 8px; }
  .seg .btn:last-child { border-radius:0 8px 8px 0; }
  .seg .btn.on { color:var(--acc); border-color:var(--acc); position:relative; z-index:1; }
  /* 网格视图：精简卡片，宽屏一行多张，压缩整页纵向长度。
     单元放大（UI 审计 P2-8，owner 拍板 5 列@1280）：clamp 列宽 160~230px（390px 手机自动回 2 列），gap 8→12 */
  #list.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(160px,18vw,230px),1fr)); gap:12px; align-content:start; }
  /* 长列表布局/绘制（audit C1）：离屏行/卡片跳过布局与绘制，1500+ 台整表 innerHTML 后的 layout/paint
     大头由此吃掉；intrinsic-size 给近似高度防滚动条跳动（auto=记住首渲实际尺寸）；与台标 lazy/swap 淡入正交 */
  #list.grid .card { content-visibility:auto; contain-intrinsic-size:auto 132px; }
  #list:not(.grid) .row { content-visibility:auto; contain-intrinsic-size:auto 44px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:8px; min-height:100px; transition:background-color .15s, border-color .15s; }
  .card:hover, .card.playing { background:var(--panel); }
  .card.playing { border-color:var(--acc); position:relative; }
  .card.playing .cname { color:var(--acc); }
  .card.playing::after { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:10px 0 0 10px; background:var(--acc); animation:breath 1.6s ease-in-out infinite; } /* 播放卡呼吸条（E 批）：边框之外的第二重活体指示 */
  @keyframes breath { 50% { opacity:.35; } }
  .card.connecting .cname::before { content:'● '; animation:pulse 1s infinite; }
  .card.dead .cname { text-decoration:line-through; opacity:.45; }
  .chead { display:flex; gap:6px; align-items:flex-start; }
  .cname { flex:1; font-size:14px; line-height:1.45; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .cfoot { margin-top:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .cfoot .badge, .cfoot .srcs { font-size:11px; }
  /* 列表视图：两行详情（l1 台名 + 体检；meta 分类/源数）；宽屏限宽居中不浪费视口（UI 审计 P2-4） */
  #list:not(.grid) { width:100%; max-width:900px; margin:0 auto; } /* width:100%（§6.11 基线修复，不在 @media 内修）：缺它窄屏列表收缩到内容宽（390px 视口仅 ~337px），补全宽规则覆盖紧凑布局与桌面开关关闭态 */
  .row .col { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .row .l1 { display:flex; align-items:center; gap:10px; min-width:0; }
  .row .meta { font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta .badge, .row .meta .srcs { font-size:11px; }
  /* 台标（P3/§4.2/§6.10 统一外框）：.station-logo 外框负责尺寸/圆角/边框/底色——底色走 data-tone 分类
     固定色板（低饱和、白字双主题可读；未知/自建分类中性灰，不做全色相 hash），内部 .logo img 100% contain
     不裁宽图；无图/坏图同框同色（兜底首字 span 只出字，色全由外框给）。img 直连加载不受 CORS 限制，
     坏图 onerror 换首字（AIbot PR#9 review P2-c）。双布局共用同一结构：网格 40px / 列表 22px（紧凑视觉不变） */
  .station-logo { --lg:hsl(210 10% 44%); flex:0 0 auto; display:grid; place-items:center; overflow:hidden; border:1px solid var(--line); background:var(--lg); }
  .station-logo[data-tone="green"] { --lg:hsl(150 28% 34%); }
  .station-logo[data-tone="blue"] { --lg:hsl(210 32% 40%); }
  .station-logo[data-tone="teal"] { --lg:hsl(175 28% 33%); }
  .station-logo[data-tone="orange"] { --lg:hsl(28 45% 42%); }
  .station-logo[data-tone="steel"] { --lg:hsl(215 16% 44%); }
  .station-logo[data-tone="amber"] { --lg:hsl(40 42% 40%); }
  .station-logo[data-tone="plum"] { --lg:hsl(300 22% 38%); }
  .station-logo[data-tone="gold"] { --lg:hsl(50 42% 36%); }
  .station-logo .logo { width:100%; height:100%; object-fit:contain; }
  .logo.ph { display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; background:var(--lg); }
  .card .station-logo { width:40px; height:40px; border-radius:10px; }
  .row .station-logo { width:22px; height:22px; border-radius:4px; }
  .card .logo.ph { font-size:17px; }
  .row .logo.ph { font-size:11px; }
  .dheadinfo .station-logo { width:40px; height:40px; border-radius:8px; } /* 详情中心头部（B1）：原为自然尺寸，统一 40px 外框 */
  #hint { padding:6px 14px; color:var(--warn); font-size:12px; display:none; }
  .empty { padding:30px; color:var(--dim); }
  #list.grid .empty { grid-column:1 / -1; } /* 空态文案占满整行（UI 审计 P1-3：否则被压成 160px 网格窄条逐字折行） */
  /* 维护面板（⚙）：全屏遮罩 + 居中卡片，主题变量随行；file:// 降级模式同样可用（配置只落 localStorage） */
  #manage { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .mbox { background:var(--panel); border:1px solid var(--line); border-radius:12px; width:min(680px,100%); max-height:min(82vh,760px); display:flex; flex-direction:column; }
  .mhead { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .mbox .seg { margin:10px 14px 0; }
  #mMiss { margin:10px 14px 0; }
  .miss { border:1px solid var(--warn); border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.8; word-break:break-all; }
  .miss b { color:var(--warn); }
  #mCats, #mlist { flex:1; overflow-y:auto; padding:8px 14px; margin:0; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  /* P1-1（UI 审计）：#mStations 必须自成 flex 列且允许收缩，#mlist 的 flex:1 才有高度约束——
     否则「电台」页不搜索时整表撑破 .mbox，行浮出卡片底边、mfoot（导出/导入/重置）被顶出可视区 */
  #mStations { flex:1; min-height:0; display:flex; flex-direction:column; }
  #mAdd, #mq { flex:0 0 auto; }
  .mrow { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; } /* wrap：备选源管理子行（P1-a）整行换行铺满 */
  .mrow:last-child { border-bottom:none; }
  .mrow .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mrow .cnt { color:var(--dim); font-size:12px; white-space:nowrap; }
  .mrow.hidden-item .nm { text-decoration:line-through; opacity:.5; }
  .mbtn { padding:3px 8px; font-size:12px; }
  /* 备选源管理子行（P1-a/r2 ⑨）：源清单（追加的可移除）+ 探活追加输入 */
  .msrc { flex:0 0 100%; margin:2px 0 6px; padding:8px 10px; background:var(--bg); border:1px dashed var(--line); border-radius:8px; }
  .msrc-t { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .srcline { display:flex; align-items:center; gap:6px; padding:1px 0; font-size:12px; }
  .srcline .idx { font-style:normal; color:var(--dim); font-variant-numeric:tabular-nums; }
  .srcline .u { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:.85; }
  .msrc-add { display:flex; gap:6px; margin-top:6px; }
  .msrc-add input { flex:1; min-width:150px; background:var(--panel); border:1px solid var(--line); color:var(--tx); border-radius:6px; padding:5px 8px; outline:none; font:inherit; font-size:12px; }
  .msrc-add input:focus { border-color:var(--acc); }
  /* 源生命周期（B1）：⚙ 面板源行按有效序展示（启用在前/禁用殿后）；禁用行划线淡出，排序按钮边界置灰 */
  .srcline { flex-wrap:wrap; }

    html.ui-refresh .player-main { display:flex; align-items:center; justify-content:center; gap:8px; }
    html.ui-refresh .player-helpers { display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:6px 8px; min-width:0; }
    html.ui-refresh #status { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    html.ui-refresh #pp { width:48px; height:48px; padding:0; justify-content:center; border-radius:50%; background:var(--ui-accent); border-color:var(--ui-accent); color:var(--ui-on-accent); }
    html.ui-refresh #prevFav, html.ui-refresh #nextFav { width:44px; height:44px; padding:0; justify-content:center; border:none; background:none; color:var(--ui-muted); }
    html.ui-refresh #prevFav:hover, html.ui-refresh #nextFav:hover { border:none; background:var(--ui-raised); color:var(--ui-text); }
    /* toast/歌曲历史/快捷键表锚到实际底栏上方（--dock-h 实测，§4.3）；紧凑态保持各自现值不动 */
    html.ui-refresh #toast, html.ui-refresh #songhist, html.ui-refresh #keys { bottom:calc(var(--dock-h,100px) + 16px); }
  }
  @media (prefers-reduced-motion:reduce) { html.ui-refresh .vinyl { animation:none !important; } } /* 唱片旋转为 P3 接线，先立规约（§6.5） */
</style>
</head>

<!-- 桌面新版壳（ui-redesign P2/§6.1）：aside+main 包进 .dashboard-shell；compact（开关关或 <1024px）下
     wrapper display:contents、aside display:none——header/cats/list 仍是 body 的有效布局子级，零回归。
     audio/浮层（#manage/#detail/#discovery/#songhist/#toast/#keys）与 footer 留在 shell 外原位 -->
<div class="dashboard-shell">
<aside class="desktop-sidebar" aria-label="电台导航">
  <div class="side-brand"><b>VRadio</b><span>把世界，听近一点。</span></div>
  <!-- 范围导航（§3.2 单一筛选状态）：data-scope 委托给 App.setScope；计数角标 render 内随 catCounts 刷新 -->
  <div class="side-group" role="group" aria-label="收听范围">
    <button type="button" class="side-link on" id="sideAll" data-scope="all" aria-current="true"><span>全部电台</span><i class="n">0</i></button>
    <button type="button" class="side-link" id="sideFav" data-scope="favorites"><span>我的收藏</span><i class="n">0</i></button>
    <button type="button" class="side-link" id="sideRec" data-scope="recent"><span>最近收听</span><i class="n">0</i></button>
  </div>
  <div class="side-group" role="group" aria-label="管理">
    <button type="button" class="side-link" id="sideManage"><span>维护</span></button>
    <button type="button" class="side-link" id="sideMore" aria-haspopup="true" aria-expanded="false"><span>更多工具</span></button>
    <!-- 更多工具 popover 宿主（P2/§6.6）：ui-refresh + ≥1024px 时 #lowfreq 整体搬入（uiPlaceTools，节点唯一监听随行）；
         hidden 仅占首屏，boot 后改由 .open 类控显隐（不对 display:contents 的 #lowfreq 误加 hidden） -->
    <div id="sideTools" hidden></div>
  </div>
</aside>
<main class="dashboard-main" id="mainContent">
<header>
  <h1><span class="live" aria-hidden="true">●</span> VRadio</h1>
  <!-- 范围标题（P2/§3.1 顶栏）：紧凑态 hidden（boot 后显隐由 CSS 断点接管），桌面显示「范围 · 分类」 -->
  <span id="scopeTitle" class="scope-title" hidden></span>
  <input id="q" type="search" aria-label="搜索电台" title="按 / 快速聚焦，Esc 清空，↓ 进列表，? 全部快捷键" placeholder="搜索电台名，如：中国之声 / Love / NHK">
  <span class="seg" role="group" aria-label="视图切换">
    <button class="btn" id="gridBtn" aria-pressed="true" title="网格视图：精简卡片，一页看更多"><svg class="ic"><use href="#i-grid"/></svg><span>网格</span></button>
    <button class="btn" id="listBtn" aria-pressed="false" title="列表视图：两行详情（分类/源数）"><svg class="ic"><use href="#i-list"/></svg><span>列表</span></button>
  </span>
  <!-- 低频操作收组（UI 审计 P2-6）：桌面 display:contents 原样排布；≤640px 收进「⋯ 更多」菜单，header 压回两行；
       ui-refresh 桌面壳（≥1024px）下整体搬进侧栏 #sideTools popover（uiPlaceTools） -->
  <span id="lowfreq">
    <button class="btn" id="discBtn" hidden title="发现电台：本地派生推荐（精选/稳定直连/最近新增与恢复/有曲讯/未听过）"><svg class="ic"><use href="#i-compass"/></svg><span>发现</span></button>
    <button class="btn" id="syncBtn" title="同步上游国内源 + 实测重建欧美音乐台"><svg class="ic"><use href="#i-sync"/></svg><span>同步源</span></button>
    <button class="btn" id="healthBtn" title="体检当前列表的电台可用性"><svg class="ic"><use href="#i-health"/></svg><span>体检</span></button>
    <button class="btn" id="importBtn" title="导入 radio.txt / m3u 列表，或本项目导出的收藏备份"><svg class="ic"><use href="#i-import"/></svg><span>导入列表</span></button>
    <button class="btn" id="exportBtn" title="导出收藏电台为 m3u（换机/备份；导回可恢复收藏）"><svg class="ic"><use href="#i-export"/></svg><span>导出收藏</span></button>
  </span>
  <button class="btn" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="更多操作"><svg class="ic"><use href="#i-dots"/></svg></button>
  <button class="btn" id="deadBtn" aria-pressed="false" hidden title="体检不可用（✗）的电台默认隐藏；点击显示/隐藏它们"><svg class="ic"><use href="#i-x"/></svg><span>无效源</span></button>
  <button class="btn" id="manageBtn" title="分类与电台维护：移动/重命名/隐藏电台，新建/重命名/隐藏分类（个人配置，同步后保留）"><svg class="ic"><use href="#i-gear"/></svg><span>维护</span></button>
  <!-- 主题三选菜单（§6.11/Q25）：唯一实例静态骨架，app.js 只管显隐与选中态；#themeWrap 整体随断点在顶栏/#lowfreq 间搬家（uiPlaceTheme），监听与 radio.theme 语义不复制 -->
  <span id="themeWrap">
    <button class="btn" id="themeBtn" aria-haspopup="true" aria-expanded="false" aria-label="主题：跟随系统" title="主题：跟随系统"><svg class="ic"><use href="#i-auto"/></svg></button> <!-- 首屏即 SVG（AIbot PR#9 review P3-3）：默认档=auto，boot 前不闪 🌓 emoji -->
    <span id="themeMenu" hidden>
      <button type="button" class="btn" data-theme-v="auto" aria-pressed="true">跟随系统</button>
      <button type="button" class="btn" data-theme-v="light" aria-pressed="false">浅色</button>
      <button type="button" class="btn" data-theme-v="dark" aria-pressed="false">深色</button>
    </span>
  </span>
  <input type="file" id="file" accept=".txt,.csv,.m3u" hidden aria-label="导入电台列表文件">
</header>
<!-- 续听卡（P2/§3.3）：仅桌面新版壳显示（ui-refresh + ≥1024px），scope=all + cat=全部 + 无关键词时由 renderHero 渲染 -->
<section id="resumeHero" aria-label="继续收听" hidden></section>
<div id="cats" role="group" aria-label="电台分类"></div>
<div id="hint">radio.txt 未加载（file:// 下 fetch 受限）——点右上「导入列表」选择本目录的 radio.txt 即可获得全部电台；当前为内置精选。</div>
<div id="list" role="list" aria-label="电台列表"></div>
</main>
</div>
<!-- 播放器底栏三组（P3/§4.3/§6.5）：.player-identity（台名/曲讯/均衡器）+ .player-main（上一收藏/播放/下一收藏，
     G19 双端语义：#prevFav/#nextFav 与 ←/→ 键同义、紧凑态也显示）+ .player-helpers（刷新/睡眠/选源/详情/静音/
     状态/音量）。全部现有 id 原位保留、监听不动；紧凑态三组 display:contents（子级仍为 footer flex 的直接布局
     项，除新增按钮外布局零变化），桌面 ui-refresh 才落三列 grid -->
<footer class="player-dock">
  <div id="prog" hidden><i></i></div>
  <div class="player-identity">
    <div id="now" aria-live="polite"><div id="nowline" role="button" tabindex="0">未在播放</div><div id="song" role="button" tabindex="0" hidden></div></div> <!-- 两行：台名 + 曲讯（B-6）；键盘可达（audit-r2 P3-2）：可点 div 补 role/tabindex，Enter/Space 在 app.js 接线 -->
    <span id="eq" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
  <div class="player-main">
    <button class="btn" id="prevFav" aria-label="上一收藏台" title="上一收藏台（与 ← 键同义）"><svg class="ic"><use href="#i-prev"/></svg></button>
    <button class="btn" id="pp" aria-label="播放 / 暂停"><svg class="ic"><use href="#i-play"/></svg></button>
    <button class="btn" id="nextFav" aria-label="下一收藏台" title="下一收藏台（与 → 键同义）"><svg class="ic"><use href="#i-next"/></svg></button>
  </div>
  <div class="player-helpers">
    <button class="btn" id="refreshBtn" aria-label="刷新，回到直播最新处" title="刷新：断开当前连接，回到直播最新处"><svg class="ic"><use href="#i-sync"/></svg></button> <!-- 手动刷新回直播头（plan-refresh-live）：与 header「同步源」同 icon 不同语境，title 消歧 -->
    <span id="sleepWrap">
      <button class="btn" id="sleepBtn" title="睡眠定时：到点渐弱停止" aria-label="睡眠定时"><svg class="ic"><use href="#i-sleep"/></svg><span id="sleepLab"></span></button>
      <!-- 睡眠菜单（UI 审计 P3-7）：一次点选替代 15→30→60 循环（想设 60 分钟原要按三下）；进行中点击按钮直接取消 -->
      <span id="sleepMenu" hidden>
        <button type="button" class="btn" data-min="15">15 分钟</button>
        <button type="button" class="btn" data-min="30">30 分钟</button>
        <button type="button" class="btn" data-min="60">60 分钟</button>
      </span>
    </span>
    <span id="srcWrap" hidden>
      <button class="btn" id="srcBtn" title="备选源：切换当前电台的播放源 / 恢复默认" aria-label="备选源" aria-haspopup="true" aria-expanded="false"><svg class="ic"><use href="#i-dots"/></svg></button>
      <!-- 选源浮层（②a）：正在听的多源台一键切源；点行 = 用此源播放，底部 ↺ 恢复默认源 -->
      <span id="srcMenu" hidden></span>
    </span>
    <button class="btn" id="detailBtn" hidden title="电台详情：逐源诊断 / 源启停与排序 / 歌曲历史" aria-label="电台详情"><svg class="ic"><use href="#i-info"/></svg></button> <!-- 详情中心入口（B1）：正在播的台；台名行保留「回到正在播」语义不抢点 -->
    <button class="btn" id="muteBtn" aria-label="静音" title="静音 / 取消静音"><svg class="ic"><use href="#i-vol"/></svg></button>
    <span id="status" role="status" aria-live="polite"></span>
    <input type="range" id="vol" min="0" max="100" value="90" aria-label="音量">
  </div>
</footer>
<audio id="audio" preload="none"></audio>
<div id="songhist" hidden></div>
<!-- toast：后台任务通告（增量体检/自动基线），与 #status 分工——用户主动操作的反馈不走这里 -->
<div id="toast" role="status" aria-live="polite" hidden></div>
<!-- 长名完整提示单例（P3/§4.2/§9.3）：聚焦行/卡/底栏台名/曲讯时由 app.js 委托填充——截断提示不依赖浏览器
     title（键盘聚焦不出原生提示）；仅桌面新版壳启用，其余布局恒隐 -->
<div id="namett" role="tooltip" hidden></div>
<!-- 快捷键帮助（N8/r2 ⑧）：按 ? 呼出；键位集合与 app.js 实际绑定一一对应，改键位时两处同步 -->
<div id="keys" hidden tabindex="-1" role="dialog" aria-label="快捷键一览">
  <b>快捷键一览</b>
  <div class="krow"><span><kbd>/</kbd></span>聚焦搜索框</div>
  <div class="krow"><span><kbd>空格</kbd></span>播放 / 暂停</div>
  <div class="krow"><span><kbd>R</kbd></span>刷新：回到直播最新处</div>
  <div class="krow"><span><kbd>←</kbd><kbd>→</kbd></span>收藏间切台</div>
  <div class="krow"><span><kbd>↑</kbd><kbd>↓</kbd></span>列表行导航（<kbd>Home</kbd>/<kbd>End</kbd> 跳首尾）</div>
  <div class="krow"><span><kbd>Enter</kbd>/<kbd>空格</kbd></span>播放聚焦行</div>
  <div class="krow"><span><kbd>双击</kbd></span>播放并收藏该电台（移动端长按行 = 收藏）</div>
  <div class="krow"><span><kbd>Esc</kbd></span>清空搜索 / 关闭浮层与面板</div>
  <div class="krow"><span><kbd>?</kbd></span>本帮助</div>
  <div class="knote">锁屏 / 蓝牙媒体键：<kbd>⏮</kbd><kbd>⏭</kbd> = 收藏间切台</div>
</div>
<!-- 维护面板：个人分类/电台调整（localStorage 覆盖层，同步重跑后按 URL 回绑自动复用）；逻辑在 app.js -->
<div id="manage" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-label="分类与电台维护">
    <div class="mhead"><b><svg class="ic"><use href="#i-gear"/></svg> 分类与电台维护</b><button class="btn" id="mClose" title="关闭面板（Esc）"><svg class="ic"><use href="#i-x"/></svg><span>关闭</span></button></div>
    <div class="seg" role="group" aria-label="维护对象切换">
      <button class="btn on" id="mTabC">分类</button>
      <button class="btn" id="mTabS">电台</button>
    </div>
    <div id="mMiss"></div>
    <div id="mCats"></div>
    <div id="mStations" hidden>
      <div id="mAdd">
        <input id="mAName" type="text" maxlength="40" placeholder="电台名（如：我的私藏台）" aria-label="电台名">
        <input id="mAUrl" type="url" placeholder="流地址 http(s)://…（mp3/aac 直流）" aria-label="流地址">
        <select id="mACat" aria-label="分类"></select>
        <button class="btn" id="mAddBtn"><svg class="ic"><use href="#i-plus"/></svg><span>添加</span></button>
      </div>
      <input id="mq" type="search" placeholder="搜索要维护的电台（含已隐藏），如：动感 / CNN / 戏曲" aria-label="搜索电台">
      <div id="mlist" role="list"></div>
    </div>
    <div class="mfoot">
      <label class="mck"><input type="checkbox" id="mSidecar" title="备份附带本机质量与收听统计数据（探活/播放的聚合统计 + 按日收听时长，跨机迁移用；不含任何响应正文；默认不含）">含统计数据</label>
      <button class="btn" id="mBackup" title="导出全部本地数据为 v3 完整备份（收藏/维护配置/健康标记/歌曲历史 + 个人电台 my-radio；可勾选附带质量/收听统计数据）——换浏览器/换机的兜底通道">备份全部</button>
      <button class="btn" id="mRestore" title="从完整备份恢复（v1/v2/v3 均可读；覆盖本地全部数据，预览确认后执行）">恢复备份</button>
      <button class="btn" id="mPlaylist" title="导入歌单文件（m3u / pls / xspf / asx / txt）：先解析为纯本地条目（不联网探活），预览新增/已知/重复/非法四桶，确认后新台写入 my-radio.txt">导入歌单</button>
      <button class="btn" id="mPaste" title="粘贴纯链接文本（每行一个 http(s) 流地址）导入个人列表">粘贴链接</button>
      <button class="btn" id="mExport" title="导出维护配置为 JSON（备份/换机；收藏另有 m3u 导出）">导出配置</button>
      <button class="btn" id="mImport" title="导入维护配置 JSON（覆盖本地全部维护配置，确认后执行）">导入配置</button>
      <button class="btn" id="mReset" title="清空全部维护配置，分类与电台回到同步默认">重置</button>
      <input type="file" id="mfile" accept=".json,application/json" hidden aria-label="导入维护配置文件">
      <input type="file" id="mfile2" accept=".json,application/json" hidden aria-label="导入完整备份文件">
      <input type="file" id="mfile3" accept=".m3u,.pls,.xspf,.asx,.wax,.wmx,.txt,audio/x-mpegurl,audio/x-scpls,application/xml,text/plain" hidden aria-label="导入歌单文件">
    </div>
  </div>
</div>
<!-- 详情中心（B1，plan-expansion-r4 §5.3）：台信息/逐源诊断/源生命周期动作/歌曲历史；
     入口 = 列表行与网格卡 ⓘ 按钮、footer ⓘ（正在播的台）、⚙ 面板源管理「详情」；逻辑在 app.js -->
<div id="detail" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-label="电台详情">
    <div class="mhead"><b><svg class="ic"><use href="#i-info"/></svg> 电台详情</b><button class="btn" id="dClose" title="关闭（Esc）"><svg class="ic"><use href="#i-x"/></svg><span>关闭</span></button></div>
    <div id="detailBody"></div>
  </div>
</div>
<!-- 发现页（B3，plan-expansion-r4 §7.3）：本地派生六分组推荐（纯本地、不联网、不改主列表排序）；
     入口 = header「发现」（features.discovery 开关，默认关）；点击行统一 Player.play；逻辑在 app.js -->
<div id="discovery" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-label="发现电台">
    <div class="mhead"><b><svg class="ic"><use href="#i-compass"/></svg> 发现电台</b><button class="btn" id="discClose" title="关闭（Esc）"><svg class="ic"><use href="#i-x"/></svg><span>关闭</span></button></div>
    <div id="discBody"></div>
  </div>
</div>
<!-- 结构壳：样式与结构在此，逻辑按模块契约分置；
     顺序 = store（存储收敛层，方案二）→ player（引擎）→ logos（台标数据）→ radio-data（同步生成的全库数据，
     file:// 降级直读，文件缺失仅控制台 404 不影响）→ features（发布开关，B3 独立单元）→ srcorder（源顺序/禁用
     纯函数，B1 双端同语义）→ quality-store（源质量 sidecar，B2：详情质量摘要 + playback/diagnostic 样本出口）→
     metadata（曲讯事件管线，B3：归一化 + 世代状态机）→ listen-stats（收听统计，B3：状态机 + 日桶 sidecar）→
     playlist-import（歌单多格式解析，B4）→ backup（备份 v3 纯逻辑，B4）→ app（数据/渲染）→ sync（同步/体检编排）；
     store 最底层（player/app 的读写出口）、logos 先于 app 装载（boot 渲染行内入口时即引用）、srcorder/quality-store
     先于 app（applyCfg 消费 SrcOrder；详情中心与播放映射读 QualityStore）、metadata/listen-stats 在 features 后
     app 前（app.boot 即建管线/按开关 init 统计）；经典 script 是 file:// 硬约束 --><script src="hls.min.js"></script>
<script src="store.js"></script>
<script src="player.js"></script>
<script src="logos.js"></script>
<script src="radio-data.js"></script>
<script src="features.js"></script>
<script src="srcorder.js"></script>
<script src="quality-store.js"></script>
<script src="metadata.js"></script>
<script src="listen-stats.js"></script><script src="playlist-import.js"></script>
<script src="backup.js"></script><script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
