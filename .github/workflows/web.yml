# Web CI 门禁（P1，docs/testing-strategy-2026-11.md §3 L2 骨架落地 + §5 PR 必过门）：
#   node = L0/L1/L2 全量 npm test 在 Node 14/18/20 三版本矩阵（Node 14 leg 是 engines >=14 政策的守门——
#   出现 14 不兼容默认修代码，只有显式 ADR 才升 engines，见方案 §7 P1 Node 14 政策）；
#   browser = 正式页面 Chromium PR smoke（.ci/browser 独立供给，根项目零 npm 依赖不破）。
# 证据面（AIbot review#39 第 5 条）：测试输出 tee 到按 Node 版本命名的日志 + 零依赖汇总 JSON，if:always()
#   上传（轻量文本，成功失败都留档）；截图类大产物维持「仅失败」上传。退出码经 set -o pipefail 保留——
#   tee 只旁路证据、不改门禁语义。汇总 step 校验正则命中（review#39-r2 P2-②）：测试提前崩溃/输出漂移/日志为空时
#   写显式失败标记（files:0, failed:-1, note）并使 step 失败——artifact 永远可消费，不再上传 null 摘要还装绿。
# 预算（review#39-r2 P2-②，#36 P2「预算绑定 CI 行」落地）：node job timeout-minutes:10 / browser job 6。
# 注意：本文件结构本地已做 YAML 解析 + with/step 层级人工自查；Linux runner 真跑（三版本矩阵 + Chromium）
#   无法本地复现，须 push 后远端 CI 首跑验证（job 全部执行并产出结果）后方可登记为 required checks。
name: web
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    strategy:
      matrix: { node: ['14', '18', '20'] }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - name: 全量测试（tee 证据日志，pipefail 保留退出码）
        run: |
          set -o pipefail
          npm test 2>&1 | tee "test-output-node${{ matrix.node }}.log"
      - name: 汇总证据 JSON（正则未命中 → 显式失败标记并使 step 失败，artifact 永远可消费）
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const f = 'test-output-node${{ matrix.node }}.log';
            const log = fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '';
            const m = log.match(/(\d+) 个测试文件，(\d+) 个失败/);
            if (!m) {
              fs.writeFileSync('test-evidence-node${{ matrix.node }}.json', JSON.stringify({ node: process.version, head: process.env.GITHUB_SHA || '', files: 0, failed: -1, note: 'evidence parse failed', at: new Date().toISOString() }, null, 2));
              console.error('证据解析失败：日志尾行未命中「N 个测试文件，M 个失败」（测试提前崩溃/输出漂移/日志为空）');
              process.exit(1);
            }
            fs.writeFileSync('test-evidence-node${{ matrix.node }}.json', JSON.stringify({ node: process.version, head: process.env.GITHUB_SHA || '', files: +m[1], failed: +m[2], at: new Date().toISOString() }, null, 2));
          "
      - name: 上传测试证据（轻量日志/JSON，成功失败都留档）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-node${{ matrix.node }}
          path: |
            test-output-node${{ matrix.node }}.log
            test-evidence-node${{ matrix.node }}.json
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --prefix .ci/browser
      - run: npx --prefix .ci/browser playwright install --with-deps chromium
      - name: PR smoke（tee 证据日志，pipefail 保留退出码）
        run: |
          set -o pipefail
          node ui-demo/pr-smoke.cjs 2>&1 | tee pr-smoke-output.log
        env:
          CI: '1'
          VRADIO_PLAYWRIGHT: '${{ github.workspace }}/.ci/browser/node_modules/playwright'
      - name: 上传轻量证据（validation.json + 日志，成功失败都留档）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-evidence
          path: |
            pr-smoke-output.log
            docs/test-reports/pr-smoke/validation.json
          if-no-files-found: ignore
      - name: 上传失败现场（截图类大产物，仅失败）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-report
          path: docs/test-reports/pr-smoke
          if-no-files-found: ignore
