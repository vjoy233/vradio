# Android instrumented Smoke 草案（grilling 共识，当前手动/夜间运行；下一批稳定后再纳入 PR）
name: android-instrumented-draft

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android instrumented Smoke（API 35 草案）
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: android/gradlew --project-dir android connectedDebugAndroidTest --stacktrace
      - name: 上传 instrumentation 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-report
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
          if-no-files-found: ignore
