<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VRadio · 网络电台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231a2027'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%234fc08d'/%3E%3Cpath d='M8 12a10 10 0 0 1 0 8M24 12a10 10 0 0 1 0 8' stroke='%234fc08d' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a323c; --tx:#e8ecf1; --dim:#8b97a5; --acc:#4fc08d; --warn:#e07a5f; color-scheme:dark; }
  :root[data-theme="light"] { --bg:#f4f6f8; --panel:#ffffff; --line:#d9dee4; --tx:#1f2733; --dim:#5d6a77; --acc:#1f7a54; --warn:#b5431a; color-scheme:light; } /* 浅色主题（E5）：data-theme 由 app.js 按手动选择/系统偏好写入；acc/warn 按浅色底单独分档（UI 审计 P1-2：深色档在白面板仅 2.27/2.95:1 不达 WCAG AA，实测 #1f7a54=5.29 #b5431a=5.55） */
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; display:flex; flex-direction:column; height:100vh; height:100dvh; } /* dvh：iOS 动态工具栏下不被裁切（P3-9） */
  :focus-visible { outline:2px solid var(--acc); outline-offset:1px; } /* 键盘焦点可见（不删 outline；outline 自动跟随元素圆角） */
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; position:relative; }
  header h1 { font-size:16px; font-weight:600; white-space:nowrap; }
  header h1 .live { color:var(--acc); }
  #q { flex:1; min-width:140px; background:var(--panel); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:7px 12px; outline:none; font:inherit; }
  #q:focus { border-color:var(--acc); }
  .btn { background:var(--panel); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap; font:inherit; transition:border-color .15s, background-color .15s; }
  .btn:hover { border-color:var(--acc); }
  .btn.on { color:var(--acc); border-color:var(--acc); }
  .btn:active, .chip:active, .row:active, .card:active { transform:translateY(1px); } /* 按压物理反馈（UI 审计 A 批：此前无 :active 态） */
  .fav:active { transform:scale(.9); }
  #cats { display:flex; gap:8px; padding:8px 14px; overflow-x:auto; border-bottom:1px solid var(--line); flex:0 0 auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  /* 分类条两端渐隐（UI 审计 P3-5）：按滚动位置由 app.updateCatsFade 切换 mask，提示横向可滚 */
  #cats.fade-l.fade-r { mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent); -webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent); }
  #cats.fade-l:not(.fade-r) { mask-image:linear-gradient(90deg,transparent,#000 18px); -webkit-mask-image:linear-gradient(90deg,transparent,#000 18px); }
  #cats.fade-r:not(.fade-l) { mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent); -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent); }
  .chip { padding:5px 12px; min-height:30px; border-radius:999px; border:1px solid var(--line); color:var(--dim); cursor:pointer; white-space:nowrap; font:inherit; font-size:13px; background:transparent; transition:color .15s, border-color .15s; }
  .chip:hover { color:var(--tx); }
  .chip.on { color:var(--acc); border-color:var(--acc); }
  .chip .n { font-style:normal; font-size:10px; color:var(--dim); margin-left:5px; } /* 数量角标（UI 审计 P3-5）：预判列表规模 */
  .chip.on .n { color:inherit; opacity:.7; }
  #list { flex:1; overflow-y:auto; padding:6px 14px 90px; scroll-padding-bottom:90px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; } /* scroll-padding 防止焦点行被固定 footer 遮挡；细滚动条（UI 审计 A 批） */
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; transition:background-color .15s; }
  .row:hover, .row.playing { background:var(--panel); }
  .row.playing .name { color:var(--acc); }
  .row.playing .name::before { content:'▶ '; color:var(--acc); }
  .row.connecting .name::before { content:'● '; animation:pulse 1s infinite; } /* 连接中脉冲提示等待 */
  @keyframes pulse { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) { .row.connecting .name::before, .card.connecting .cname::before, #eq.on i { animation:none; } * { transition:none !important; } }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 6px; white-space:nowrap; }
  .srcs { font-size:12px; color:var(--dim); white-space:nowrap; }
  .fav { color:var(--dim); font-size:16px; padding:4px 6px; margin:-4px 0; border:none; border-radius:8px; background:none; cursor:pointer; line-height:1; transition:color .15s; } /* 扩大点击区域 ≥24px；圆角 6→8 归档（UI 审计 P3-3 圆角七档收敛） */
  .fav:hover { color:#f5c542; }
  .fav.on { color:#f5c542; }
  :root[data-theme="light"] .fav:hover, :root[data-theme="light"] .fav.on { color:#8a6508; } /* 浅色下 #f5c542 对白面板仅 1.62:1 金星隐形（P1-2），定 #8a6508=5.32:1 */
  .row.dead .name { text-decoration:line-through; opacity:.45; }
  .health { font-size:12px; white-space:nowrap; }
  .health.ok { color:var(--acc); } .health.bad { color:var(--warn); }
  .btn:disabled { opacity:.5; cursor:wait; }
  footer { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; gap:12px; align-items:center; flex-wrap:wrap; } /* safe-area：全面屏底部不被遮挡（P3-9） */
  footer #now { flex:1; min-width:120px; overflow:hidden; display:flex; flex-direction:column; line-height:1.45; } /* 两行：台名 + 曲讯（B-6） */
  footer #nowline { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #song { font-size:12px; color:var(--dim); cursor:pointer; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #song:hover { color:var(--acc); }
  #songhist { position:fixed; right:14px; bottom:72px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; max-width:min(380px, 82vw); max-height:38vh; overflow-y:auto; z-index:9; font-size:12px; } /* 歌曲历史浮层（B-7） */
  #songhist[hidden] { display:none; }
  #songhist b { display:block; margin-bottom:4px; color:var(--dim); font-weight:500; }
  .shrow { padding:2px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  footer #status { font-size:12px; color:var(--dim); }
  #vol { width:110px; accent-color:var(--acc); }
  #sleepBtn { min-width:76px; font-variant-numeric:tabular-nums; } /* 倒计时每秒变宽会引起 footer 抖动（UI 审计 P3-2）：min-width + 等宽数字 */
  .srcs, .cnt, .health, .badge { font-variant-numeric:tabular-nums; }
  #eq { display:inline-flex; align-items:flex-end; gap:2px; height:14px; } /* 均衡器动画（E6）：一眼可辨「活着且在播」 */
  #eq i { width:3px; height:4px; background:var(--dim); border-radius:1px; }
  #eq.on i { background:var(--acc); animation:eq .9s ease-in-out infinite; }
  #eq.on i:nth-child(2) { animation-delay:.25s; }
  #eq.on i:nth-child(3) { animation-delay:.5s; }
  @keyframes eq { 50% { height:14px; } }
  /* 视图切换段控（网格=精简卡片 / 列表=两行详情） */
  .seg { display:inline-flex; }
  .seg .btn { border-radius:0; margin-left:-1px; }
  .seg .btn:first-child { border-radius:8px 0 0 8px; }
  .seg .btn:last-child { border-radius:0 8px 8px 0; }
  .seg .btn.on { color:var(--acc); border-color:var(--acc); position:relative; z-index:1; }
  /* 网格视图：精简卡片，宽屏一行多张，压缩整页纵向长度。
     单元放大（UI 审计 P2-8，owner 拍板 5 列@1280）：clamp 列宽 160~230px（390px 手机自动回 2 列），gap 8→12 */
  #list.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(160px,18vw,230px),1fr)); gap:12px; align-content:start; }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:8px; min-height:100px; transition:background-color .15s, border-color .15s; }
  .card:hover, .card.playing { background:var(--panel); }
  .card.playing { border-color:var(--acc); }
  .card.playing .cname { color:var(--acc); }
  .card.playing .cname::before { content:'▶ '; color:var(--acc); }
  .card.connecting .cname::before { content:'● '; animation:pulse 1s infinite; }
  .card.dead .cname { text-decoration:line-through; opacity:.45; }
  .chead { display:flex; gap:6px; align-items:flex-start; }
  .cname { flex:1; font-size:14px; line-height:1.45; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .cfoot { margin-top:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .cfoot .badge, .cfoot .srcs { font-size:11px; }
  /* 列表视图：两行详情（l1 台名 + 体检；meta 分类/源数）；宽屏限宽居中不浪费视口（UI 审计 P2-4） */
  #list:not(.grid) { max-width:900px; margin:0 auto; }
  .row .col { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .row .l1 { display:flex; align-items:center; gap:10px; min-width:0; }
  .row .meta { font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta .badge, .row .meta .srcs { font-size:11px; }
  /* 台标：网格 40px / 列表 22px；img 直连加载不受 CORS 限制，坏图 onerror 移除回退首字母色块。
     色块兜底（UI 审计 P2-3，owner 拍板）：底色=台名 hash 确定性生成，白字双主题稳，有图无图节奏统一 */
  .logo { flex:0 0 auto; object-fit:cover; border:1px solid var(--line); background:var(--panel); }
  .card .logo { width:40px; height:40px; border-radius:10px; }
  .row .logo { width:22px; height:22px; border-radius:4px; }
  .logo.ph { display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; border:none; }
  .card .logo.ph { font-size:17px; }
  .row .logo.ph { font-size:11px; }
  #hint { padding:6px 14px; color:var(--warn); font-size:12px; display:none; }
  .empty { padding:30px; color:var(--dim); }
  #list.grid .empty { grid-column:1 / -1; } /* 空态文案占满整行（UI 审计 P1-3：否则被压成 160px 网格窄条逐字折行） */
  /* 维护面板（⚙）：全屏遮罩 + 居中卡片，主题变量随行；file:// 降级模式同样可用（配置只落 localStorage） */
  #manage { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #manage[hidden] { display:none; }
  .mbox { background:var(--panel); border:1px solid var(--line); border-radius:12px; width:min(680px,100%); max-height:min(82vh,760px); display:flex; flex-direction:column; }
  .mhead { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .mbox .seg { margin:10px 14px 0; }
  #mMiss { margin:10px 14px 0; }
  .miss { border:1px solid var(--warn); border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.8; word-break:break-all; }
  .miss b { color:var(--warn); }
  #mCats, #mlist { flex:1; overflow-y:auto; padding:8px 14px; margin:0; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  /* P1-1（UI 审计）：#mStations 必须自成 flex 列且允许收缩，#mlist 的 flex:1 才有高度约束——
     否则「电台」页不搜索时整表撑破 .mbox，行浮出卡片底边、mfoot（导出/导入/重置）被顶出可视区 */
  #mStations { flex:1; min-height:0; display:flex; flex-direction:column; }
  #mAdd, #mq { flex:0 0 auto; }
  .mrow { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .mrow:last-child { border-bottom:none; }
  .mrow .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mrow .cnt { color:var(--dim); font-size:12px; white-space:nowrap; }
  .mrow.hidden-item .nm { text-decoration:line-through; opacity:.5; }
  .mbtn { padding:3px 8px; font-size:12px; }
  #mq { width:100%; margin:10px 0 4px; background:var(--bg); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:7px 12px; outline:none; font:inherit; }
  #mq:focus { border-color:var(--acc); }
  .mrow select { background:var(--bg); border:1px solid var(--line); color:var(--tx); border-radius:6px; padding:4px 6px; font:inherit; font-size:12px; max-width:9em; }
  /* 添加自定义电台（A-2）：面板电台页顶部表单，先探活（拒绝假流/死链）再写入 my-radio.txt（持久层，区别于 cfg 显示层） */
  #mAdd { display:flex; gap:6px; padding:10px 14px 0; flex-wrap:wrap; }
  #mAdd input { flex:1; min-width:110px; background:var(--bg); border:1px solid var(--line); color:var(--tx); border-radius:6px; padding:6px 8px; outline:none; font:inherit; font-size:12px; }
  #mAdd input:focus { border-color:var(--acc); }
  #mAdd select { background:var(--bg); border:1px solid var(--line); color:var(--tx); border-radius:6px; padding:6px; font:inherit; font-size:12px; max-width:9em; }
  .mfoot { display:flex; gap:8px; justify-content:flex-end; padding:10px 14px; border-top:1px solid var(--line); }
  /* 更多菜单（UI 审计 P2-6）：桌面 display:contents 按钮原样排布；≤640px 收进锚定 header 右下的浮层 */
  #lowfreq { display:contents; }
  #moreBtn { display:none; }
  #sleepWrap { position:relative; display:inline-flex; }
  #sleepMenu { position:absolute; right:0; bottom:calc(100% + 8px); display:flex; flex-direction:column; gap:2px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:8em; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:6; }
  #sleepMenu[hidden] { display:none; }
  #sleepMenu .btn { border:none; background:none; justify-content:flex-start; }
  @media (max-width:640px) {
    header { padding:8px 10px; gap:8px; }
    #lowfreq { display:none; position:absolute; top:100%; right:8px; margin-top:6px; flex-direction:column; gap:2px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:9em; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:6; }
    #lowfreq.open { display:flex; }
    #lowfreq .btn { border:none; background:none; justify-content:flex-start; }
    #moreBtn { display:inline-block; }
    .fav { font-size:19px; padding:8px 9px; margin:-8px 0; } /* 触屏命中区 ~37px（原 ~26px 达标偏小，UI 审计 P2-6 备注） */
  }
</style>
</head>
<body>
<header>
  <h1><span class="live" aria-hidden="true">●</span> VRadio</h1>
  <input id="q" type="search" aria-label="搜索电台" title="按 / 快速聚焦，Esc 清空，↓ 进列表" placeholder="搜索电台名，如：中国之声 / Love / NHK">
  <span class="seg" role="group" aria-label="视图切换">
    <button class="btn" id="gridBtn" aria-pressed="true" title="网格视图：精简卡片，一页看更多">▦ 网格</button>
    <button class="btn" id="listBtn" aria-pressed="false" title="列表视图：两行详情（分类/源数）">☰ 列表</button>
  </span>
  <!-- 低频操作收组（UI 审计 P2-6）：桌面 display:contents 原样排布；≤640px 收进「⋯ 更多」菜单，header 压回两行 -->
  <span id="lowfreq">
    <button class="btn" id="syncBtn" title="同步上游国内源 + 实测重建欧美音乐台">同步源</button>
    <button class="btn" id="healthBtn" title="体检当前列表的电台可用性">体检</button>
    <button class="btn" id="importBtn" title="导入 radio.txt / m3u 列表，或本项目导出的收藏备份">导入列表</button>
    <button class="btn" id="exportBtn" title="导出收藏电台为 m3u（换机/备份；导回可恢复收藏）">导出收藏</button>
  </span>
  <button class="btn" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="更多操作">⋯</button>
  <button class="btn" id="deadBtn" aria-pressed="false" hidden title="体检不可用（✗）的电台默认隐藏；点击显示/隐藏它们">✗ 无效源</button>
  <button class="btn" id="manageBtn" title="分类与电台维护：移动/重命名/隐藏电台，新建/重命名/隐藏分类（个人配置，同步后保留）">⚙ 维护</button>
  <button class="btn" id="themeBtn" aria-label="主题：跟随系统，点击切换" title="主题：跟随系统（点击循环：跟随系统 → 浅色 → 深色）">🌓</button>
  <input type="file" id="file" accept=".txt,.csv,.m3u" hidden aria-label="导入电台列表文件">
</header>
<div id="cats" role="group" aria-label="电台分类"></div>
<div id="hint">radio.txt 未加载（file:// 下 fetch 受限）——点右上「导入列表」选择本目录的 radio.txt 即可获得全部电台；当前为内置精选。</div>
<div id="list" role="list" aria-label="电台列表"></div>
<footer>
  <button class="btn" id="pp" aria-label="播放 / 暂停">▶</button>
  <span id="eq" aria-hidden="true"><i></i><i></i><i></i></span>
  <div id="now" aria-live="polite"><div id="nowline">未在播放</div><div id="song" hidden></div></div>
  <span id="sleepWrap">
    <button class="btn" id="sleepBtn" title="睡眠定时：到点渐弱停止" aria-label="睡眠定时">😴</button>
    <!-- 睡眠菜单（UI 审计 P3-7）：一次点选替代 15→30→60 循环（想设 60 分钟原要按三下）；进行中点击按钮直接取消 -->
    <span id="sleepMenu" hidden>
      <button type="button" class="btn" data-min="15">15 分钟</button>
      <button type="button" class="btn" data-min="30">30 分钟</button>
      <button type="button" class="btn" data-min="60">60 分钟</button>
    </span>
  </span>
  <button class="btn" id="muteBtn" aria-label="静音" title="静音 / 取消静音">🔊</button>
  <span id="status" role="status" aria-live="polite"></span>
  <input type="range" id="vol" min="0" max="100" value="90" aria-label="音量">
</footer>
<audio id="audio" preload="none"></audio>
<div id="songhist" hidden></div>
<!-- 维护面板：个人分类/电台调整（localStorage 覆盖层，同步重跑后按 URL 回绑自动复用）；逻辑在 app.js -->
<div id="manage" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-label="分类与电台维护">
    <div class="mhead"><b>⚙ 分类与电台维护</b><button class="btn" id="mClose" title="关闭面板（Esc）">✕ 关闭</button></div>
    <div class="seg" role="group" aria-label="维护对象切换">
      <button class="btn on" id="mTabC">分类</button>
      <button class="btn" id="mTabS">电台</button>
    </div>
    <div id="mMiss"></div>
    <div id="mCats"></div>
    <div id="mStations" hidden>
      <div id="mAdd">
        <input id="mAName" type="text" maxlength="40" placeholder="电台名（如：我的私藏台）" aria-label="电台名">
        <input id="mAUrl" type="url" placeholder="流地址 http(s)://…（mp3/aac 直流）" aria-label="流地址">
        <select id="mACat" aria-label="分类"></select>
        <button class="btn" id="mAddBtn">＋ 添加</button>
      </div>
      <input id="mq" type="search" placeholder="搜索要维护的电台（含已隐藏），如：动感 / CNN / 戏曲" aria-label="搜索电台">
      <div id="mlist" role="list"></div>
    </div>
    <div class="mfoot">
      <button class="btn" id="mExport" title="导出维护配置为 JSON（备份/换机；收藏另有 m3u 导出）">导出配置</button>
      <button class="btn" id="mImport" title="导入维护配置 JSON（覆盖本地全部维护配置，确认后执行）">导入配置</button>
      <button class="btn" id="mReset" title="清空全部维护配置，分类与电台回到同步默认">重置</button>
      <input type="file" id="mfile" accept=".json,application/json" hidden aria-label="导入维护配置文件">
    </div>
  </div>
</div>
<!-- 结构壳：样式与结构在此，逻辑按模块契约分置四文件；
     顺序 = player（引擎）→ logos（台标数据）→ app（数据/渲染）→ sync（同步/体检编排）；
     logos 先于 app 装载（boot 渲染行内入口时即引用）；经典 script 是 file:// 硬约束 -->
<script src="hls.min.js"></script>
<script src="player.js"></script>
<script src="logos.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
