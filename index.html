<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRadio · 网络电台</title>
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a323c; --tx:#e8ecf1; --dim:#8b97a5; --acc:#4fc08d; --warn:#e07a5f; color-scheme:dark; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; display:flex; flex-direction:column; height:100vh; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:1px; } /* 键盘焦点可见（不删 outline；outline 自动跟随元素圆角） */
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; font-weight:600; white-space:nowrap; }
  header h1 .live { color:var(--acc); }
  #q { flex:1; min-width:140px; background:var(--panel); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:7px 12px; outline:none; font:inherit; }
  #q:focus { border-color:var(--acc); }
  .btn { background:var(--panel); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap; font:inherit; transition:border-color .15s, background-color .15s; }
  .btn:hover { border-color:var(--acc); }
  #cats { display:flex; gap:8px; padding:8px 14px; overflow-x:auto; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .chip { padding:5px 12px; min-height:30px; border-radius:999px; border:1px solid var(--line); color:var(--dim); cursor:pointer; white-space:nowrap; font:inherit; font-size:13px; background:transparent; transition:color .15s, border-color .15s; }
  .chip:hover { color:var(--tx); }
  .chip.on { color:var(--acc); border-color:var(--acc); }
  #list { flex:1; overflow-y:auto; padding:6px 14px 90px; scroll-padding-bottom:90px; } /* scroll-padding 防止焦点行被固定 footer 遮挡 */
  .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; transition:background-color .15s; }
  .row:hover, .row.playing { background:var(--panel); }
  .row.playing .name { color:var(--acc); }
  .row.playing .name::before { content:'▶ '; color:var(--acc); }
  .row.connecting .name::before { content:'● '; animation:pulse 1s infinite; } /* 连接中脉冲提示等待 */
  @keyframes pulse { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) { .row.connecting .name::before { animation:none; } * { transition:none !important; } }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 6px; white-space:nowrap; }
  .srcs { font-size:12px; color:var(--dim); white-space:nowrap; }
  .fav { color:var(--dim); font-size:16px; padding:4px 6px; margin:-4px 0; border:none; border-radius:6px; background:none; cursor:pointer; line-height:1; transition:color .15s; } /* 扩大点击区域 ≥24px */
  .fav:hover { color:#f5c542; }
  .fav.on { color:#f5c542; }
  .row.dead .name { text-decoration:line-through; opacity:.45; }
  .health { font-size:12px; white-space:nowrap; }
  .health.ok { color:var(--acc); } .health.bad { color:var(--warn); }
  .btn:disabled { opacity:.5; cursor:wait; }
  footer { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  footer #now { flex:1; min-width:120px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  footer #status { font-size:12px; color:var(--dim); }
  #vol { width:110px; accent-color:var(--acc); }
  #hint { padding:6px 14px; color:var(--warn); font-size:12px; display:none; }
  .empty { padding:30px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1><span class="live" aria-hidden="true">●</span> VRadio</h1>
  <input id="q" type="search" aria-label="搜索电台" title="按 / 快速聚焦，Esc 清空" placeholder="搜索电台名，如：中国之声 / Love / NHK">
  <button class="btn" id="syncBtn" title="同步上游国内源 + 实测重建欧美音乐台">同步源</button>
  <button class="btn" id="healthBtn" title="体检当前列表的电台可用性">体检</button>
  <button class="btn" id="importBtn">导入列表</button>
  <input type="file" id="file" accept=".txt,.csv,.m3u" hidden aria-label="导入电台列表文件">
</header>
<div id="cats" role="group" aria-label="电台分类"></div>
<div id="hint">radio.txt 未加载（file:// 下 fetch 受限）——点右上「导入列表」选择本目录的 radio.txt 即可获得全部电台；当前为内置精选。</div>
<div id="list" aria-label="电台列表"></div>
<footer>
  <button class="btn" id="pp" aria-label="播放 / 暂停">▶</button>
  <div id="now" aria-live="polite">未在播放</div>
  <span id="status" role="status" aria-live="polite"></span>
  <input type="range" id="vol" min="0" max="100" value="90" aria-label="音量">
</footer>
<audio id="audio" preload="none"></audio>
<!-- 结构壳：样式与结构在此，逻辑按模块契约分置三文件（docs/review.md 十一节）；
     顺序 = player（引擎）→ app（数据/渲染）→ sync（同步/体检编排）；经典 script 是 file:// 硬约束 -->
<script src="hls.min.js"></script>
<script src="player.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
