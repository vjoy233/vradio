# 夜间层（P3，docs/testing-strategy-2026-11.md §3 L5 + §7 P3）：不阻塞普通 PR，可重复运行并产出报告。
#   drills = 故障注入 + kill 中断发布恢复 + 资产两代轮换 + 并发压力（全离线）；
#   soak = 长时播放/连接回收（workflow 30min；断言 = 零 5xx + 曲讯不串台 + fixture 连接受回收 + Linux 侧 RSS 哨兵）；
#   real-sources = 真实源抽样（数据健康类——漂移只进报告不判代码失败，先探公网连通性区分网络环境 vs 源漂移）；
#   browser-nightly = Chromium 全矩阵（browser-matrix 十视口/缩放/forced-colors/键盘 + multi-tab 多标签对抗）。
# Firefox/Edge 夜间矩阵与 Safari 实机、NVDA/VoiceOver、实体 Android 属发布前层——脚本/环境就绪前不设 job
# （方案纪律：不得静默跳过，也不把环境差异伪装成已通过；未覆盖项在 PR 说明与脚本文件头留档）。
name: nightly
on:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * *'
jobs:
  drills-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm run test:nightly -- --soak=1800
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-drills-soak, path: docs/test-reports/nightly }
        if-no-files-found: ignore
  real-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node test/nightly/run.js --real --quick
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-real-sources, path: docs/test-reports/nightly/real-sources.json }
        if-no-files-found: ignore
  browser-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --prefix .ci/browser
      - run: npx --prefix .ci/browser playwright install --with-deps chromium
      - run: node ui-demo/browser-matrix.cjs
        env: { CI: '1', VRADIO_PLAYWRIGHT: '${{ github.workspace }}/.ci/browser/node_modules/playwright' }
      - run: node ui-demo/multi-tab.cjs
        env: { CI: '1', VRADIO_PLAYWRIGHT: '${{ github.workspace }}/.ci/browser/node_modules/playwright' }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: nightly-browser, path: docs/test-reports }
        if-no-files-found: ignore
