<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRadio · 网络电台</title>
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a323c; --tx:#e8ecf1; --dim:#8b97a5; --acc:#4fc08d; --warn:#e07a5f; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; font-weight:600; white-space:nowrap; }
  header h1 .live { color:var(--acc); }
  #q { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:7px 12px; outline:none; }
  #q:focus { border-color:var(--acc); }
  .btn { background:var(--panel); border:1px solid var(--line); color:var(--tx); border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:var(--acc); }
  #cats { display:flex; gap:8px; padding:8px 14px; overflow-x:auto; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .chip { padding:3px 12px; border-radius:999px; border:1px solid var(--line); color:var(--dim); cursor:pointer; white-space:nowrap; font-size:13px; }
  .chip.on { color:var(--acc); border-color:var(--acc); }
  #list { flex:1; overflow-y:auto; padding:6px 14px 90px; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; }
  .row:hover { background:var(--panel); }
  .row.playing .name { color:var(--acc); }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 6px; white-space:nowrap; }
  .srcs { font-size:11px; color:var(--dim); white-space:nowrap; }
  .fav { color:var(--dim); font-size:16px; padding:0 4px; }
  .fav.on { color:#f5c542; }
  .row.dead .name { text-decoration:line-through; opacity:.45; }
  .health { font-size:12px; white-space:nowrap; }
  .health.ok { color:var(--acc); } .health.bad { color:var(--warn); }
  .btn:disabled { opacity:.5; cursor:wait; }
  footer { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:12px; align-items:center; }
  footer #now { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  footer #status { font-size:12px; color:var(--dim); }
  #vol { width:110px; accent-color:var(--acc); }
  #hint { padding:6px 14px; color:var(--warn); font-size:12px; display:none; }
</style>
</head>
<body>
<header>
  <h1><span class="live">●</span> VRadio</h1>
  <input id="q" placeholder="搜索电台名，如：中国之声 / Love / NHK">
  <button class="btn" id="syncBtn" title="同步上游国内源 + 实测重建欧美音乐台">同步源</button>
  <button class="btn" id="healthBtn" title="体检当前列表的电台可用性">体检</button>
  <button class="btn" id="importBtn">导入列表</button>
  <input type="file" id="file" accept=".txt,.csv,.m3u" hidden>
</header>
<div id="cats"></div>
<div id="hint">radio.txt 未加载（file:// 下 fetch 受限）——点右上「导入列表」选择本目录的 radio.txt 即可获得全部电台；当前为内置精选。</div>
<div id="list"></div>
<footer>
  <button class="btn" id="pp">▶</button>
  <div id="now">未在播放</div>
  <span id="status"></span>
  <input type="range" id="vol" min="0" max="100" value="90">
</footer>
<audio id="audio" preload="none"></audio>
<script src="hls.min.js"></script>
<script>
/* ---------- 内置精选（地址已实测直连可用；含同一电台的多个备选源） ---------- */
const STARTER = [
  { c:'常听', n:'Love Radio FM103.7 经典金曲', u:['http://lhttp.qingting.fm/live/273/64k.mp3','http://ls.qingting.fm/live/273.m3u8'] },
  { c:'常听', n:'动感101 FM101.7', u:['http://lhttp.qingting.fm/live/274/64k.mp3','http://live.xmcdn.com/live/53/64.m3u8'] },
  { c:'常听', n:'经典947 FM94.7', u:['http://lhttp.qingting.fm/live/267/64k.mp3','http://live.xmcdn.com/live/54/64.m3u8'] },
  { c:'常听', n:'上海东广新闻台', u:['http://lhttp.qingting.fm/live/275/64k.mp3'] },
  { c:'常听', n:'上海交通台 FM105.7', u:['http://lhttp.qingting.fm/live/266/64k.mp3','http://ls.qingting.fm/live/266.m3u8'] },
  { c:'常听', n:'CNR 中国之声', u:['http://ngcdn001.cnr.cn/live/zgzs/index.m3u8'] },
  { c:'常听', n:'CNR 音乐之声', u:['http://ngcdn003.cnr.cn/live/yyzs/index.m3u8'] },
  { c:'常听', n:'CRI 环球资讯广播 FM90.5', u:['http://sk.cri.cn/905.m3u8'] },
  { c:'常听', n:'CRI 怀旧金曲频道', u:['https://lhttp.qingting.fm/live/5022038/64k.mp3'] },
  { c:'常听', n:'Asia FM 亚洲经典台', u:['https://lhttp.qingting.fm/live/5021912/64k.mp3'] },
  { c:'世界', n:'YES 933 (新加坡)', u:['http://playerservices.streamtheworld.com/api/livestream-redirect/YES933AAC.aac'] },
  { c:'世界', n:'Class 95 (新加坡)', u:['http://playerservices.streamtheworld.com/api/livestream-redirect/CLASS95AAC.aac'] },
  { c:'世界', n:'Listen.Moe JPop', u:['https://listen.moe/stream'] },
  { c:'世界', n:'Nightwave Plaza', u:['http://radio.plaza.one/opus'] },
];

/* ---------- 状态 ---------- */
let stations = STARTER.slice();          // [{c,n,u:[...]}]
let favs = new Set(JSON.parse(localStorage.getItem('radio.favs') || '[]'));
let cat = '全部', keyword = '', playingKey = null, playToken = 0, hls = null;

const $ = id => document.getElementById(id);
const audio = $('audio');
const keyOf = s => s.c + '|' + s.n;

/* ---------- 解析 radio.txt（"分类,#genre#" 分节，每行 名字,地址） ---------- */
function parse(text) {
  const map = new Map(); let sec = '未分类';
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    if (line.endsWith('#genre#')) { sec = line.replace(/,#genre#$/, ''); continue; }
    const i = line.lastIndexOf(','); if (i < 0) continue;
    const n = line.slice(0, i).trim(), u = line.slice(i + 1).trim();
    if (!/^https?:\/\//.test(u)) continue;
    const k = sec + '|' + n;
    if (!map.has(k)) map.set(k, { c: sec, n, u: [] });
    if (!map.get(k).u.includes(u)) map.get(k).u.push(u);
  }
  return [...map.values()];
}
function setData(list, merge) {
  if (!merge) { stations = list; }
  else {
    const byKey = new Map(stations.map(s => [keyOf(s), s]));
    for (const s of list) {
      const k = keyOf(s), cur = byKey.get(k);
      if (cur) s.u.forEach(u => !cur.u.includes(u) && cur.u.push(u));
      else byKey.set(k, s);
    }
    stations = [...byKey.values()];
  }
  buildCats(); render();
}

/* ---------- 播放：多源自动切换（失败换下一个地址） ---------- */
function variants(u) {
  const vs = [];
  // 蜻蜓 m3u8 → lhttp 同 id 的 64k mp3 直播流（实测可裸播，优先级最高）
  const qt = u.match(/ls\.qingting\.fm\/live\/(\d+)\.m3u8/);
  if (qt) vs.push('http://lhttp.qingting.fm/live/' + qt[1] + '/64k.mp3');
  vs.push(u);
  // 本地 server.js 的流代理：同源转发，绕开 m3u8/hls.js 的 CORS 限制（仅 http 页面可用）
  if (location.protocol.startsWith('http')) vs.push('/proxy?url=' + encodeURIComponent(u));
  return vs;
}
function play(s) {
  const urls = s.u.flatMap(variants); let i = 0;
  const token = ++playToken; playingKey = keyOf(s); render();
  $('now').textContent = '▶ ' + s.n; $('pp').textContent = '⏸';

  const next = () => {
    if (token !== playToken) return;
    if (i >= urls.length) { $('status').textContent = '⚠ 全部源失败'; return; }
    const u = urls[i++]; $('status').textContent = '连接中… 源' + i + '/' + urls.length;
    load(u, token, next);
  };
  next();
}
function load(u, token, onFail) {
  stopHls();
  const viaProxy = u.startsWith('/proxy');
  const raw = viaProxy ? decodeURIComponent(u.replace(/^\/proxy\?url=/, '')) : u;
  const isHls = /\.m3u8(\?|$)/.test(raw);
  // 走代理时的远端基准：相对路径分片要拼回远端（hls.js 会把相对分片解析到 localhost）
  const proxyBase = viaProxy ? new URL(raw).href : null;
  audio.onerror = () => token === playToken && onFail();
  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({
      enableWorker: false,
      manifestLoadingMaxRetry: 1, levelLoadingMaxRetry: 1, fragLoadingMaxRetry: 2, // 快速失败以便切换备选源
      xhrSetup: (xhr, url) => {
        if (!proxyBase) return;
        if (url.includes('/proxy?url=')) return; // 已是代理形态
        const abs = url.startsWith(location.origin) ? new URL(url.slice(location.origin.length + 1), proxyBase).href : url;
        xhr.open('GET', '/proxy?url=' + encodeURIComponent(abs));
      }
    });
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal && token === playToken) { stopHls(); onFail(); } });
    hls.loadSource(viaProxy ? raw : u); hls.attachMedia(audio);
    audio.play().catch(() => {});
  } else {
    audio.src = u; audio.play().catch(() => {});
  }
}
function stopHls() { if (hls) { hls.destroy(); hls = null; } }
function stop() { playToken++; stopHls(); audio.removeAttribute('src'); audio.load(); playingKey = null; $('now').textContent = '未在播放'; $('pp').textContent = '▶'; $('status').textContent = ''; render(); }

audio.addEventListener('playing', () => $('status').textContent = '直播中');
$('pp').onclick = () => audio.paused && playingKey ? play(stations.find(s => keyOf(s) === playingKey)) : audio.pause();
$('vol').oninput = e => audio.volume = e.target.value / 100;
audio.volume = 0.9;

/* ---------- 渲染 ---------- */
const CAT_ORDER = ['音乐', '欧美音乐']; // 音乐场景置顶
function buildCats() {
  const present = new Set(stations.map(s => s.c));
  const cats = ['全部', '★收藏', ...CAT_ORDER.filter(c => present.has(c)), ...[...present].filter(c => !CAT_ORDER.includes(c))];
  $('cats').innerHTML = cats.map(c => `<span class="chip${c === cat ? ' on' : ''}" data-c="${c}">${c}</span>`).join('');
}
$('cats').onclick = e => { if (e.target.dataset.c) { cat = e.target.dataset.c; buildCats(); render(); } };

function visible() {
  const kw = keyword.toLowerCase();
  return stations.filter(s =>
    (cat === '全部' || (cat === '★收藏' ? favs.has(keyOf(s)) : s.c === cat)) &&
    (!kw || s.n.toLowerCase().includes(kw)));
}
function render() {
  $('list').innerHTML = visible().map(s => {
    const k = keyOf(s), on = favs.has(k);
    const hp = s.health ? `<span class="health ${s.health === 'ok' ? 'ok' : 'bad'}">${s.health === 'ok' ? '✓' : '✗'}</span>` : '';
    return `<div class="row${k === playingKey ? ' playing' : ''}${s.health === 'dead' ? ' dead' : ''}" data-k="${k}">
      <span class="fav${on ? ' on' : ''}" data-fav="${k}">${on ? '★' : '☆'}</span>
      <span class="name">${s.n}</span>${hp}
      <span class="badge">${s.c}</span><span class="srcs">${s.u.length}源</span></div>`;
  }).join('') || '<div style="padding:30px;color:var(--dim)">无匹配电台</div>';
}
$('list').onclick = e => {
  const fav = e.target.dataset.fav;
  if (fav) { favs.has(fav) ? favs.delete(fav) : favs.add(fav); localStorage.setItem('radio.favs', JSON.stringify([...favs])); render(); return; }
  const row = e.target.closest('.row'); if (!row) return;
  const s = stations.find(x => keyOf(x) === row.dataset.k); if (s) play(s);
};
$('q').oninput = e => { keyword = e.target.value.trim(); render(); };

/* ---------- 一键同步最新源（国内上游 + 欧美台实测重建，约1分钟） ---------- */
$('syncBtn').onclick = async () => {
  const b = $('syncBtn'); b.disabled = true; b.textContent = '同步中…';
  $('status').textContent = '同步中：国内上游 + 欧美台逐个实测，约 1 分钟…';
  try {
    const r = await fetch('/api/sync', { method: 'POST' }).then(x => x.json());
    if (r.error) throw new Error(r.error);
    const t = await fetch('radio.txt?t=' + Date.now()).then(x => x.text());
    setData(parse(t), false);
    $('status').textContent = `同步完成：共 ${r.total} 台（${r.delta >= 0 ? '+' : ''}${r.delta}；欧美音乐 ${r.euKept || 0} 个实测可用）`;
  } catch (e) { $('status').textContent = '同步失败（file:// 或无后端时请在项目目录跑 node update-sources.js）：' + e.message; }
  b.disabled = false; b.textContent = '同步源';
};

/* ---------- 体检：当前列表逐台探测（服务端检测，无 CORS 限制），标 ✓/✗ ---------- */
$('healthBtn').onclick = async () => {
  const b = $('healthBtn'); b.disabled = true; b.textContent = '体检中…';
  const list = visible(); let done = 0, alive = 0;
  const q = list.slice();
  const upd = () => { $('status').textContent = `体检 ${done}/${list.length}，可用 ${alive}`; render(); };
  const worker = async () => { while (q.length) { const s = q.shift();
    try { const r = await fetch('/api/check?url=' + encodeURIComponent(s.u[0])).then(x => x.json()); s.health = r.ok ? 'ok' : 'dead'; if (r.ok) alive++; } catch (_) { s.health = 'dead'; }
    done++; if (done % 5 === 0 || !q.length) upd(); } };
  await Promise.all(Array.from({ length: 5 }, worker));
  $('status').textContent = `体检完成：${alive}/${list.length} 可用（✗ 台建议换源或点「同步源」重建）`;
  b.disabled = false; b.textContent = '体检';
};

/* ---------- 列表加载：radio.txt + 个人补充 my-radio.txt，file:// 下回退内置 + 手动导入 ---------- */
fetch('radio.txt').then(r => r.ok ? r.text() : Promise.reject())
  .then(t => setData(parse(t), true))
  .catch(() => { $('hint').style.display = 'block'; });
fetch('my-radio.txt').then(r => r.ok ? r.text() : Promise.reject())  // 个人自建列表（已 gitignore，不会被同步覆盖）
  .then(t => setData(parse(t), true)).catch(() => {});
$('importBtn').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { setData(parse(String(r.result)), false); $('hint').style.display = 'none'; };
  r.readAsText(f, 'utf-8');
};

buildCats(); render();
</script>
</body>
</html>
